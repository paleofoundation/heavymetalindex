name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new commit to the same PR, or a newer push to main, cancels the run it replaces.
concurrency:
  group: hmi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The corpus outgrew Node's default ~2 GB heap in build-alias-redirects.test.ts (OOM on main after #469).
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run lint:page-structure
      - run: npm run lint:page-openings
      - run: npm run lint:thin-with-evidence
      - run: npm run check
      - name: Hero images (no placeholder or fallback on added/changed ingredient, product, metal pages)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node tools/lint/hero-image-placeholders.mjs --changed "origin/${BASE_REF}"
      - name: Evidence fill diff gate (supplier data, em or en dashes, placeholder images)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node tools/evidence-fill/diff-gate.mjs --base "origin/${BASE_REF}"

  # Quartz build (~30 min) plus the read-only audits Vercel skips (~12 min).
  # The job always reports the check name `build-audits`. On a skip it exits
  # green in a few seconds, so a required status of that name does not sit
  # at "skipped" and block auto-merge.
  #
  # Full run:
  #   - every pull request whose head is not evidence-fill/*
  #     (human and other non-fill PRs, including wiki-only diffs, because
  #     this is the only place those audits run: Vercel sets VERCEL=1 and
  #     skips them)
  #   - an evidence-fill PR that touches build or config (package, Quartz
  #     other than hero stills, workflows, tools/build, or an audit script)
  # Short run (success, no checkout):
  #   - evidence-fill PRs that stay off those paths (the fill workflow already
  #     ran test, lints, check, and diff-gate before opening the PR)
  #   - pushes to main (Vercel builds main; git.deploymentEnabled.main is true)
  build-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Decide whether to run the Quartz build and audits
        id: gate
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json, os, urllib.request

          def is_build_or_config(path):
              if not path or path.startswith("quartz/static/heroes/"):
                  return False
              if path in {
                  "package.json",
                  "package-lock.json",
                  "vercel.json",
                  ".node-version",
              }:
                  return True
              if path == "tsconfig.json" or (path.startswith("tsconfig.") and path.endswith(".json")):
                  return True
              if path.startswith("quartz.config."):
                  return True
              if path.startswith(".github/") or path.startswith("tools/build/") or path.startswith("quartz/"):
                  return True
              base = path.rsplit("/", 1)[-1]
              if path.startswith("tools/") and base.startswith("audit-"):
                  return True
              return False

          def paths_of(entry):
              for key in ("filename", "previous_filename"):
                  value = entry.get(key) or ""
                  if value:
                      yield value

          head = os.environ.get("HEAD_REF") or ""
          run_full = False
          reason = "evidence-fill PR does not touch build or config; fill already ran test, lints, check, and diff-gate"
          if not head.startswith("evidence-fill/"):
              run_full = True
              reason = "pull request is not an evidence-fill branch; Quartz build and read-only audits run here"
          else:
              base_sha = os.environ.get("BASE_SHA") or ""
              head_sha = os.environ.get("HEAD_SHA") or ""
              if not base_sha or not head_sha:
                  run_full = True
                  reason = "evidence-fill PR is missing a base or head sha; running the full build"
              else:
                  url = f"https://api.github.com/repos/{os.environ['REPO']}/compare/{base_sha}...{head_sha}"
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "hmi-ci-build-audits",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          data = json.load(resp)
                  except Exception as exc:
                      run_full = True
                      reason = f"could not read the evidence-fill diff ({exc.__class__.__name__}); running the full build"
                  else:
                      files = data.get("files") or []
                      # The compare API returns at most 300 files. A full page cannot prove the rest is content-only.
                      if len(files) >= 300:
                          run_full = True
                          reason = "evidence-fill diff returned 300 files and may be truncated; running the full build"
                      else:
                          hit = []
                          for entry in files:
                              for path in paths_of(entry):
                                  if is_build_or_config(path) and path not in hit:
                                      hit.append(path)
                          if hit:
                              run_full = True
                              shown = ", ".join(hit[:8])
                              reason = f"evidence-fill PR touches build or config ({shown})"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run_full={'true' if run_full else 'false'}\n")
              handle.write("reason<<HMI_REASON_END\n")
              handle.write(reason.replace("\r", " ").replace("\n", " ") + "\n")
              handle.write("HMI_REASON_END\n")
          print(f"run_full={str(run_full).lower()}")
          print(reason)
          PY

      - name: Apply the decision
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_RUN_FULL: ${{ steps.gate.outputs.run_full }}
          PR_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            run_full=false
            reason="push to main; Vercel builds main, so this job does not compile again"
          elif [ "$PR_RUN_FULL" = "true" ] || [ "$PR_RUN_FULL" = "false" ]; then
            run_full="$PR_RUN_FULL"
            reason="$PR_REASON"
          else
            echo "The pull request gate did not report a decision."
            exit 1
          fi
          echo "run_full=${run_full}" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<HMI_REASON_END"
            printf '%s\n' "$reason"
            echo "HMI_REASON_END"
          } >> "$GITHUB_OUTPUT"
          echo "run_full=${run_full}"
          printf '%s\n' "$reason"

      - name: Record the decision
        env:
          REASON: ${{ steps.decision.outputs.reason }}
          RUN_FULL: ${{ steps.decision.outputs.run_full }}
        run: |
          {
            echo "### build-audits"
            echo "Full Quartz build and audits: ${RUN_FULL}"
            printf '%s\n' "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.decision.outputs.run_full == 'true'
      - uses: actions/setup-node@v4
        if: steps.decision.outputs.run_full == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.decision.outputs.run_full == 'true'
        run: npm ci
      - name: Build the site without the read-only audits
        if: steps.decision.outputs.run_full == 'true'
        run: npm run build
        env:
          HMI_SKIP_BUILD_AUDITS: "1"
          HMI_PREBUILD_HEAP: "4096"
          HMI_QUARTZ_CONCURRENCY: "1"
          HMI_QUARTZ_HEAP: "6144"
      - name: Audits the Vercel build skips
        if: steps.decision.outputs.run_full == 'true'
        run: npm run audit:build
      - name: Skipped the Quartz build and audits
        if: steps.decision.outputs.run_full != 'true'
        env:
          REASON: ${{ steps.decision.outputs.reason }}
        run: printf '%s\n' "build-audits passed without a site build. ${REASON}"
