name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:page-structure
      - run: npm run lint:page-openings
      - run: npm run lint:thin-with-evidence
      - run: npm run check
      - name: Hero images (no placeholder or fallback on added/changed ingredient, product, metal pages)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          node tools/lint/hero-image-placeholders.mjs --changed origin/${{ github.base_ref }}
