name: autonomy-heartbeat-watchdog

# Off-Mac liveness backstop for the self-building wiki daemon.
#
# WHY THIS EXISTS (2026-05-30):
# The autonomy daemon runs on Karen's Mac mini via launchd. Every liveness
# signal it produces (heartbeat.txt, tick logs, the morning report) lives ON
# the mini. So when the mini itself is the thing that fails — powered off,
# network down, the launchd agent unloaded, the keep-awake assertion lost, or
# the working tree wedged on a foreign code edit so the daemon preflight
# refuses to run — there is NOTHING on the mini able to raise the alarm. The
# failure is invisible precisely because the machine that would report it is
# the one that is down. That is how a stall went unnoticed for 12-13 hours.
#
# This workflow runs on GitHub's always-on infrastructure, independent of the
# mini, and checks one external, hard-to-fake signal: has `main` received a
# commit recently? The daemon (and the Codex/grants agents) push to main
# every few minutes during normal operation, so a multi-hour gap means the
# whole operation has stalled. When that happens this workflow fails (which
# emails the repo owner) and opens/updates a single tracking issue. It
# auto-closes the issue when commits resume.
#
# This is defense-in-depth. The primary fix for the recurring stall is the
# keep-awake LaunchAgent (tools/autonomy/com.paleo.heavymetalindex.awake.plist)
# which stops the mini sleeping. This watchdog catches everything that fix
# cannot: power loss, network loss, agent-unload, and tree-wedge stalls.

on:
  schedule:
    # Hourly at :23 (off the top-of-hour cron stampede; GitHub cron timing is
    # best-effort and can lag 5-15 min, which is fine for a multi-hour check).
    - cron: '23 * * * *'
  workflow_dispatch: {}   # allow an on-demand "check now" from the Actions tab

# Least-privilege: only what the issue-management step needs.
permissions:
  contents: read
  issues: write

concurrency:
  group: autonomy-heartbeat
  cancel-in-progress: false

jobs:
  check-liveness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (for commit timestamps)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Evaluate daemon liveness from last commit age
        id: liveness
        env:
          # Alert if main has had no commit in this many hours. The daemon
          # commits briefings/reports/sync-counts every tick even when there
          # is no ingest work, and observed cadence is a commit every 1-6 min
          # during active operation, so 6h of TOTAL silence is abnormal and
          # indicates a real stall — not a quiet patch. Tune here if needed.
          STALE_HOURS: '6'
        run: |
          set -uo pipefail
          last_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date -u +%s)"
          age_hours=$(( (now_epoch - last_epoch) / 3600 ))
          last_subject="$(git log -1 --format=%s)"
          echo "age_hours=${age_hours}" >> "$GITHUB_OUTPUT"
          echo "last_subject=${last_subject}" >> "$GITHUB_OUTPUT"
          echo "Last commit to main was ${age_hours}h ago (threshold ${STALE_HOURS}h): ${last_subject}"
          if [ "${age_hours}" -ge "${STALE_HOURS}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the stall alert issue
        if: steps.liveness.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ageH = '${{ steps.liveness.outputs.age_hours }}';
            const last = `${{ steps.liveness.outputs.last_subject }}`;
            const title = '⚠️ HMI autonomy daemon appears stalled';
            const body = [
              `The Mac-mini autonomy daemon has not pushed a commit to \`main\` in **${ageH} hours**.`,
              `Last commit on main: \`${last}\`.`,
              '',
              'Triage on the mini, in order:',
              '1. Is the mini awake / powered on / online? Wake it.',
              '2. Keep-awake agent: `launchctl list | grep awake` and `pgrep -lf "caffeinate -i"` — should both show something.',
              '3. Daemon agent: `launchctl list | grep daemon`; check `/tmp/heavymetalindex-daemon.err.log` and the newest file in `data/evidence/autonomy/daemon-runs/`.',
              '4. Wedged tree: `cd ~/Desktop/heavy-metal-index && git status` — if a foreign `tools/`, `api/`, `package.json`, or `vercel.json` edit sits uncommitted, the daemon preflight is refusing to run until it is committed.',
              '5. Halt switch: make sure `~/.heavymetalindex.STOP` does not exist.',
              '',
              'This issue auto-closes when commits to `main` resume.',
              '',
              `_Checked ${new Date().toISOString()} by the autonomy-heartbeat workflow._`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'autonomy-stall', per_page: 10,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['autonomy-stall'],
              });
            }

      - name: Auto-close the stall issue when commits have resumed
        if: steps.liveness.outputs.stale == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const ageH = '${{ steps.liveness.outputs.age_hours }}';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'autonomy-stall', per_page: 10,
            });
            for (const iss of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: iss.number,
                body: `✅ Commits to \`main\` have resumed (last commit ${ageH}h ago, under threshold). Auto-closing. _${new Date().toISOString()}_`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: iss.number, state: 'closed',
              });
            }

      - name: Fail the run when stale (this is what emails the repo owner)
        if: steps.liveness.outputs.stale == 'true'
        run: |
          echo "::error::HMI autonomy daemon stalled — no commit to main in ${{ steps.liveness.outputs.age_hours }}h"
          exit 1
