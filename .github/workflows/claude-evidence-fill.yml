# Scheduled page fill. One unit from paleofoundation/hmi-evidence-deposits per run,
# taken from graph/next_work.json when that file lists an unblocked
# hmi-evidence-fill item, otherwise the next DEPOSITED ingredient or product.
# Claude writes the page. This workflow merges the latest main, runs the same
# checks as CI, and opens evidence-fill/<unit> only when those checks pass.
# It does not edit the structure, openings, or thin-with-evidence baselines.
# It does not run --write-baseline. A count below a baseline passes.
#
# .claude/settings.json is not applied by claude-code-action, so the tool list is
# passed with --allowedTools below.
#
# Secrets, both required or the fill job skips with a warning:
#   CLAUDE_CODE_OAUTH_TOKEN  Claude Code OAuth token (claude setup-token)
#   DEPOSITS_READ_TOKEN      read access to paleofoundation/hmi-evidence-deposits
#
# The Claude GitHub App should be installed on this repository so the push that
# opens the pull request is not made with the default GITHUB_TOKEN (that token
# does not start the CI workflows auto-merge waits for).
#
# A schedule run's github.actor is the account that last changed the cron line
# below. That account is often a human, the person who last merged this file,
# so the name does not end in [bot]. An empty github_token sends the run through
# Anthropic's OIDC app-token exchange, which returns 401 when that identity
# lacks write access. A bot actor such as cursor[bot] has the same 401, because
# that app has no write permission.
# Schedule runs always pass this job's GITHUB_TOKEN into the action, and bot
# actors do too. Those runs then dispatch CI, because the job token does not
# start the pull_request workflows auto-merge waits for. A human
# workflow_dispatch leaves github_token empty so the app-token path is used
# when the Claude app has write access.
# After Claude returns, schedule runs and bot actors put that job token back
# on origin: the action rewrites the remote, and its post step can leave a
# dead credential.
# The cron is minute 17, not minute 0: GitHub delays and then drops a scheduled
# run that is still waiting when the next tick is due, and the top of the hour
# is when that delay is worst.

name: Claude evidence fill

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pick a unit and stop before Claude writes a page
        type: boolean
        default: false
  # No pull_request trigger. The content-gate job repeated diff-gate and the
  # hero-image lint, which CI's test job already runs on the opened PR.

# One scheduled fill at a time. cancel-in-progress stays false on purpose:
# the cron is every 2 hours and the fill job may run for up to 6 hours.
# Cancelling the in-progress run would abort a live Claude fill when the next
# schedule starts. GitHub queues this group and keeps only the latest pending run.
concurrency:
  group: claude-evidence-fill
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEPOSITS_READ_TOKEN: ${{ secrets.DEPOSITS_READ_TOKEN }}
        run: |
          set -euo pipefail
          ready=true
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is unset. The evidence fill is skipped."
            ready=false
          fi
          if [ -z "${DEPOSITS_READ_TOKEN}" ]; then
            echo "::warning::DEPOSITS_READ_TOKEN is unset. The evidence fill is skipped."
            ready=false
          fi
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

  # Pull-request supplier, dash, and hero checks run in CI (the test job).
  fill:
    needs: preflight
    if: github.event_name != 'pull_request' && needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    # npm ci runs Puppeteer's postinstall, which downloads chrome-headless-shell.
    # Scheduled fill does not launch a browser. Skip that download so a reset
    # connection cannot fail install (run 42316389810, read ECONNRESET).
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install PDF text tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Clone evidence deposits
        env:
          DEPOSITS_READ_TOKEN: ${{ secrets.DEPOSITS_READ_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/hmi-evidence-deposits"
          # A full clone of the PDF tree fills the runner disk (run 41904870463).
          # Blobless sparse checkout keeps the work graph and ledger text.
          # The chosen unit's files are fetched in the next step.
          df -h / | tail -1
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${DEPOSITS_READ_TOKEN}@github.com/paleofoundation/hmi-evidence-deposits.git" \
            "${RUNNER_TEMP}/hmi-evidence-deposits"
          git -C "${RUNNER_TEMP}/hmi-evidence-deposits" ls-tree -r --name-only HEAD > "${RUNNER_TEMP}/deposit-tree.txt"
          LIST="${RUNNER_TEMP}/deposit-tree.txt" OUT="${RUNNER_TEMP}/deposit-text.txt" python3 - <<'PY'
          import os
          names = open(os.environ["LIST"], encoding="utf-8", errors="replace").read().splitlines()
          skip = (".pdf", ".png", ".jpg", ".jpeg", ".webp", ".gif", ".tif", ".tiff", ".zip", ".gz")
          text_ext = (".json", ".jsonl", ".csv", ".md", ".txt", ".yml", ".yaml")
          bare = {"status", "slug", "ingredient", "page", "target", "wiki"}
          priority, rest = [], []
          for name in names:
              lower = name.lower()
              if lower.endswith(skip):
                  continue
              base = lower.rsplit("/", 1)[-1]
              if not (lower.endswith(text_ext) or base in bare):
                  continue
              if name == "graph/next_work.json" or base in {"status", "readme.md"} or "ledger" in base or name.count("/") <= 1:
                  priority.append(name)
              else:
                  rest.append(name)
          chosen = priority + rest
          cap = 5000
          if len(chosen) > cap:
              must = [item for item in chosen if item == "graph/next_work.json" or item.count("/") <= 1]
              chosen = (must + [item for item in chosen if item not in must])[:cap]
          def anchor(name):
              # A leading slash keeps "!" and "#" literal. Escape glob characters.
              escaped = "".join("\\" + ch if ch in "*?[]\\" else ch for ch in name)
              return "/" + escaped
          with open(os.environ["OUT"], "w", encoding="utf-8") as handle:
              if chosen:
                  handle.write("\n".join(anchor(name) for name in chosen) + "\n")
          print(f"sparse text files: {len(chosen)}")
          print("graph/next_work.json in sparse list:", "graph/next_work.json" in chosen)
          PY
          if [ -s "${RUNNER_TEMP}/deposit-text.txt" ]; then
            git -C "${RUNNER_TEMP}/hmi-evidence-deposits" sparse-checkout set --no-cone --stdin < "${RUNNER_TEMP}/deposit-text.txt"
          fi
          if [ ! -f "${RUNNER_TEMP}/hmi-evidence-deposits/graph/next_work.json" ]; then
            echo "graph/next_work.json was not materialized. Adding that path."
            git -C "${RUNNER_TEMP}/hmi-evidence-deposits" sparse-checkout add "graph/next_work.json" || true
          fi
          if [ -f "${RUNNER_TEMP}/hmi-evidence-deposits/graph/next_work.json" ]; then
            wc -c "${RUNNER_TEMP}/hmi-evidence-deposits/graph/next_work.json"
          else
            echo "graph/next_work.json is still absent after sparse-checkout."
          fi
          df -h / | tail -1
      - name: Pick the next deposited unit
        id: pick
        env:
          DEPOSITS_ROOT: ${{ runner.temp }}/hmi-evidence-deposits
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          skips="$(gh pr list --state open --limit 200 --json headRefName --jq '[.[] | select(.headRefName | startswith("evidence-fill/")) | .headRefName | sub("^evidence-fill/"; "")] | join(",")')"
          json="$(node tools/evidence-fill/select-next-unit.mjs --root "$DEPOSITS_ROOT" --skip "$skips")"
          echo "$json"
          unit_file="${RUNNER_TEMP:-/tmp}/next-unit.json"
          printf '%s' "$json" > "$unit_file"
          UNIT_FILE="$unit_file" python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ["UNIT_FILE"]))
          kind = data.get("kind") or ""
          family = "products" if kind == "product" else "ingredients"
          slug = data.get("slug") or ""
          page = f"wiki/{family}/{slug}.md" if slug else ""
          dry = os.environ.get("DRY_RUN") == "true"
          unit = "" if dry else (data.get("unit") or "")
          if dry and data.get("unit"):
              print(f"Dry run only. Claude will not run for {data.get('unit')}.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in (
                  ("unit", unit),
                  ("slug", slug),
                  ("dir", data.get("dir") or ""),
                  ("kind", kind or "ingredient"),
                  ("family", family),
                  ("page", page),
              ):
                  handle.write(f"{key}={value}\n")
          PY
          if [ "$(printf '%s' "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("unit") or "")')" = "" ]; then
            echo "No unblocked hmi-evidence-fill graph item, and no deposited ingredient or product. Nothing to do."
          fi
      - name: Fetch the chosen deposit files
        if: steps.pick.outputs.unit != ''
        env:
          DIR: ${{ steps.pick.outputs.dir }}
          DEPOSITS_ROOT: ${{ runner.temp }}/hmi-evidence-deposits
        run: |
          set -euo pipefail
          if [ ! -d "${DEPOSITS_ROOT}/.git" ]; then
            echo "Deposits checkout has no git metadata. The full tree is already present."
            exit 0
          fi
          unit_dir="${DIR%/}"
          git -C "$DEPOSITS_ROOT" sparse-checkout add "${unit_dir}/"
          git -C "$DEPOSITS_ROOT" checkout HEAD -- "$unit_dir"
          df -h / | tail -1
      - name: Build the fill prompt
        id: prompt
        if: steps.pick.outputs.unit != ''
        env:
          UNIT: ${{ steps.pick.outputs.unit }}
          SLUG: ${{ steps.pick.outputs.slug }}
          DIR: ${{ steps.pick.outputs.dir }}
          KIND: ${{ steps.pick.outputs.kind }}
          FAMILY: ${{ steps.pick.outputs.family }}
          PAGE: ${{ steps.pick.outputs.page }}
          DEPOSITS_ROOT: ${{ runner.temp }}/hmi-evidence-deposits
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          text = pathlib.Path("tools/evidence-fill/prompt.md").read_text()
          for key in ("UNIT", "SLUG", "DIR", "DEPOSITS_ROOT", "KIND", "FAMILY", "PAGE"):
              text = text.replace(f"__{key}__", os.environ.get(key) or "")
          delim = "EVIDENCE_FILL_PROMPT"
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"prompt<<{delim}\n{text}\n{delim}\n")
          PY
      - name: Fill the page
        id: claude
        if: steps.pick.outputs.unit != ''
        uses: anthropics/claude-code-action@v1
        env:
          DEPOSITS_READ_TOKEN: ${{ secrets.DEPOSITS_READ_TOKEN }}
          DEPOSITS_ROOT: ${{ runner.temp }}/hmi-evidence-deposits
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          github_token: "${{ (github.event_name == 'schedule' || endsWith(github.actor, '[bot]')) && github.token || '' }}"
          allowed_bots: "github-actions[bot],claude[bot],cursor[bot]"
          base_branch: main
          branch_prefix: evidence-fill/
          prompt: ${{ steps.prompt.outputs.prompt }}
          # Settings in .claude/settings.json are ignored here. List tools in claude_args.
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"
            --max-turns 80
      # Schedule runs and bot actors must re-auth after claude-code-action. That
      # action embeds the github_token it was given (this job's GITHUB_TOKEN) in
      # origin and strips checkout's extraheader. Its post step can leave a dead
      # or password-style remote, so the next git fetch fails with "Invalid
      # username or token". A human workflow_dispatch keeps the Claude app token
      # when that token still authenticates.
      - name: Restore git authentication
        id: gitauth
        if: steps.pick.outputs.unit != ''
        env:
          JOB_TOKEN: ${{ github.token }}
          CLAUDE_APP_TOKEN: ${{ steps.claude.outputs.github_token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [ -n "${CLAUDE_APP_TOKEN}" ]; then
            echo "::add-mask::${CLAUDE_APP_TOKEN}"
          fi
          if [ -n "${JOB_TOKEN}" ]; then
            echo "::add-mask::${JOB_TOKEN}"
          fi
          token_accepted() {
            local tok="$1"
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}" || true)"
            [ "$code" = "200" ]
          }
          restore_origin() {
            local tok="$1"
            local basic includes line path
            # Drop the token the action embedded. A URL credential beats extraheader,
            # so a dead userinfo would keep the next fetch on password auth.
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
            git config --local --unset-all credential.helper || true
            git config --local credential.helper ""
            includes="$(git config --local --get-regexp '^include(If\..+)?\.path$' || true)"
            if [ -n "$includes" ]; then
              while IFS= read -r line; do
                path="${line#* }"
                [ -n "$path" ] || continue
                git config --file "$path" --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
              done <<< "$includes"
            fi
            basic="$(printf 'x-access-token:%s' "$tok" | base64 -w 0)"
            git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: basic ${basic}"
          }
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [[ "${ACTOR}" == *'[bot]' ]]; then
            token="${JOB_TOKEN}"
            kind="job"
          elif [ -n "${CLAUDE_APP_TOKEN}" ] && token_accepted "${CLAUDE_APP_TOKEN}"; then
            token="${CLAUDE_APP_TOKEN}"
            kind="app"
          else
            if [ -n "${CLAUDE_APP_TOKEN}" ]; then
              echo "Claude app token cannot authenticate after claude-code-action. Using this job's GITHUB_TOKEN."
            fi
            token="${JOB_TOKEN}"
            kind="job"
          fi
          if [ -z "${token}" ] || ! token_accepted "${token}"; then
            echo "No working git token is available after the Claude step."
            exit 1
          fi
          restore_origin "$token"
          case "$(git config --local --get remote.origin.url)" in
            *x-access-token*|*@*)
              echo "origin URL still contains credentials after the reset."
              exit 1
              ;;
          esac
          git config --local --get "http.${GITHUB_SERVER_URL}/.extraheader" | grep -q '^AUTHORIZATION: basic '
          git ls-remote origin refs/heads/main >/dev/null
          {
            echo "EVIDENCE_FILL_GIT_TOKEN<<EVIDENCE_FILL_GIT_TOKEN_END"
            echo "$token"
            echo "EVIDENCE_FILL_GIT_TOKEN_END"
          } >> "$GITHUB_ENV"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
      - name: Merge main, record this page, then run CI checks
        id: verify
        if: steps.pick.outputs.unit != ''
        env:
          UNIT: ${{ steps.pick.outputs.unit }}
          SLUG: ${{ steps.pick.outputs.slug }}
          FAMILY: ${{ steps.pick.outputs.family }}
          PAGE: ${{ steps.pick.outputs.page }}
          NODE_OPTIONS: --max-old-space-size=6144
          WIKI_EDIT_AUDIT_SKIP: "1"
        run: |
          set -euo pipefail
          if [ ! -d node_modules ]; then npm ci; fi
          if [ -z "${PAGE}" ]; then
            echo "The selected unit has no wiki page path."
            exit 1
          fi
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          # Drop a whole-baseline rewrite. Fill pull requests leave the baselines on main.
          git checkout origin/main -- \
            data/evidence/page-structure-baseline.json \
            data/evidence/page-openings-baseline.json \
            data/fanout/thin-with-evidence-baseline.txt
          if [ -f "$PAGE" ]; then
            node tools/build-page-openings.mjs --apply "$PAGE"
          fi
          node --import tsx tools/build-alias-redirects.ts
          python3 - <<'PY'
          import subprocess, sys
          status = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          allowed = (
              "wiki/ingredients/",
              "wiki/products/",
              "wiki/sources/",
              "wiki/log.md",
              "data/redirects/aliases-301.json",
              "data/fanout/thin-with-evidence-baseline.txt",
              "data/evidence/page-openings-baseline.json",
              "data/evidence/page-structure-baseline.json",
              "quartz/static/heroes/",
              "data/design/page-hero-images.json",
          )
          bad = []
          for line in status.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              if not any(path == item or path.startswith(item) for item in allowed):
                  bad.append(path)
          if bad:
              print("The fill edited paths outside the page, its sources, and the regenerated files:")
              print("\n".join(bad))
              sys.exit(1)
          PY
          git add -- \
            wiki/ingredients \
            wiki/products \
            wiki/sources \
            wiki/log.md \
            data/redirects/aliases-301.json \
            data/fanout/thin-with-evidence-baseline.txt \
            data/evidence/page-openings-baseline.json \
            data/evidence/page-structure-baseline.json \
            quartz/static/heroes \
            data/design/page-hero-images.json
          if ! git diff --cached --quiet; then
            git commit -m "Evidence fill ${UNIT}: ${SLUG}"
          fi
          if ! git merge --no-edit origin/main; then
            git checkout --theirs -- \
              data/evidence/page-structure-baseline.json \
              data/evidence/page-openings-baseline.json \
              data/fanout/thin-with-evidence-baseline.txt || true
            git add -- \
              data/evidence/page-structure-baseline.json \
              data/evidence/page-openings-baseline.json \
              data/fanout/thin-with-evidence-baseline.txt || true
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Merge with main left conflicts outside the baselines."
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi
          git checkout origin/main -- \
            data/evidence/page-structure-baseline.json \
            data/evidence/page-openings-baseline.json \
            data/fanout/thin-with-evidence-baseline.txt
          git add -- \
            data/evidence/page-structure-baseline.json \
            data/evidence/page-openings-baseline.json \
            data/fanout/thin-with-evidence-baseline.txt
          if ! git diff --cached --quiet; then
            git commit -m "Evidence fill ${UNIT}: keep main baselines"
          fi
          node tools/evidence-fill/diff-gate.mjs --base origin/main
          node tools/lint/hero-image-placeholders.mjs --changed origin/main
          npm test
          npm run lint:page-structure
          npm run lint:page-openings
          npm run lint:thin-with-evidence
          npm run check
      - name: Open the pull request and enable auto-merge
        id: publish
        if: steps.pick.outputs.unit != '' && steps.verify.outcome == 'success'
        env:
          UNIT: ${{ steps.pick.outputs.unit }}
          SLUG: ${{ steps.pick.outputs.slug }}
          FAMILY: ${{ steps.pick.outputs.family }}
          PAGE: ${{ steps.pick.outputs.page }}
          CLAUDE_APP_TOKEN: ${{ steps.claude.outputs.github_token }}
          EXTRA_BRANCH: ${{ steps.claude.outputs.branch_name }}
          GIT_AUTH_KIND: ${{ steps.gitauth.outputs.kind }}
          WIKI_EDIT_AUDIT_SKIP: "1"
        run: |
          set -euo pipefail
          target="evidence-fill/${UNIT}"
          token="${EVIDENCE_FILL_GIT_TOKEN:-${CLAUDE_APP_TOKEN:-$GITHUB_TOKEN}}"
          askpass="${RUNNER_TEMP}/git-askpass.sh"
          # shellcheck disable=SC2016  # askpass must contain a literal $GIT_TOKEN
          printf '%s\n' '#!/bin/sh' 'echo "$GIT_TOKEN"' > "$askpass"
          chmod 700 "$askpass"
          git_push() {
            GIT_ASKPASS="$askpass" GIT_TOKEN="$token" git -c credential.helper= "$@"
          }
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          if ! git merge --no-edit origin/main; then
            git checkout --theirs -- \
              data/evidence/page-structure-baseline.json \
              data/evidence/page-openings-baseline.json \
              data/fanout/thin-with-evidence-baseline.txt || true
            git add -- \
              data/evidence/page-structure-baseline.json \
              data/evidence/page-openings-baseline.json \
              data/fanout/thin-with-evidence-baseline.txt || true
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Could not merge latest main before opening the pull request."
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi
          git checkout origin/main -- \
            data/evidence/page-structure-baseline.json \
            data/evidence/page-openings-baseline.json \
            data/fanout/thin-with-evidence-baseline.txt
          git add -- \
            data/evidence/page-structure-baseline.json \
            data/evidence/page-openings-baseline.json \
            data/fanout/thin-with-evidence-baseline.txt
          if ! git diff --cached --quiet; then
            git commit -m "Evidence fill ${UNIT}: keep main baselines"
          fi
          if git diff --quiet origin/main...HEAD; then
            echo "No changes against main. Not opening a pull request."
            if [ -n "${EXTRA_BRANCH}" ] && [ "${EXTRA_BRANCH}" != "$target" ]; then
              case "$EXTRA_BRANCH" in
                evidence-fill/*|claude/*) git_push push "https://github.com/${GITHUB_REPOSITORY}.git" --delete "$EXTRA_BRANCH" || true ;;
              esac
            fi
            exit 0
          fi
          git_push push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${target}"
          export GH_TOKEN="$token"
          # A push with the workflow GITHUB_TOKEN does not start pull_request
          # workflows. Dispatch CI onto this branch so the checks still run.
          # Schedule runs and bot actors push with the job token. A human
          # workflow_dispatch that still holds a live Claude app token pushes
          # with it and does not need this dispatch.
          if [ "${GIT_AUTH_KIND}" = "job" ] || [ "${GITHUB_EVENT_NAME}" = "schedule" ] || { [ -z "${GIT_AUTH_KIND}" ] && [[ "${GITHUB_ACTOR}" == *"[bot]"* ]]; }; then
            echo "Actor ${GITHUB_ACTOR} is pushing with the workflow token. Dispatching CI on ${target}."
            dispatched=false
            for _ in 1 2 3 4 5 6; do
              if gh workflow run ci.yml --ref "$target"; then
                dispatched=true
                break
              fi
              sleep 5
            done
            if [ "$dispatched" != true ]; then
              echo "::warning::CI was not dispatched on ${target}. A pull_request run will not start from this token."
            fi
          fi
          cat > "${RUNNER_TEMP}/pr-body.md" <<EOF
          Automated evidence fill for ${UNIT} (\`${FAMILY}/${SLUG}\`).

          The page was built from that deposit unit. Alias redirects were regenerated with the repo tools. The structure, openings, and thin-with-evidence baselines stay on main. The branch merged the latest main before this pull request was opened. \`npm test\`, \`npm run lint:page-structure\`, \`npm run lint:page-openings\`, \`npm run lint:thin-with-evidence\`, and \`npm run check\` passed before this pull request was opened.

          Direction: toward the literature.
          EOF
          existing="$(gh pr list --head "$target" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$target" --title "Evidence fill ${UNIT}: ${SLUG}" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -F allow_auto_merge=true \
            || echo "::warning::Could not set allow_auto_merge on the repository. The pull request auto-merge call is next."
          gh pr merge --auto --squash "$target"
          if [ -n "$EXTRA_BRANCH" ] && [ "$EXTRA_BRANCH" != "$target" ]; then
            case "$EXTRA_BRANCH" in
              evidence-fill/*|claude/*) git_push push "https://github.com/${GITHUB_REPOSITORY}.git" --delete "$EXTRA_BRANCH" || true ;;
            esac
          fi
          gh pr view "$target" --json url --jq .url
      - name: Drop the branch when the checks fail
        if: failure() && steps.verify.outcome == 'failure' && steps.claude.outputs.branch_name != ''
        env:
          EXTRA_BRANCH: ${{ steps.claude.outputs.branch_name }}
          CLAUDE_APP_TOKEN: ${{ steps.claude.outputs.github_token }}
        run: |
          set -euo pipefail
          case "$EXTRA_BRANCH" in
            evidence-fill/*|claude/*) ;;
            *) echo "Refusing to delete ${EXTRA_BRANCH}"; exit 0 ;;
          esac
          token="${EVIDENCE_FILL_GIT_TOKEN:-${CLAUDE_APP_TOKEN:-$GITHUB_TOKEN}}"
          askpass="${RUNNER_TEMP}/git-askpass.sh"
          # shellcheck disable=SC2016  # askpass must contain a literal $GIT_TOKEN
          printf '%s\n' '#!/bin/sh' 'echo "$GIT_TOKEN"' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TOKEN="$token" git -c credential.helper= \
            push "https://github.com/${GITHUB_REPOSITORY}.git" --delete "$EXTRA_BRANCH" || true
          echo "Checks failed. No pull request was opened."
