name: manual-production-deploy

# Publish heavymetalindex.com manually, not on every git push.
#
# WHY THIS EXISTS (2026-06-09):
# FRANK + Codex push to main ~140x/day. Vercel's git integration was building a
# full ~3-minute production deploy (2,900-page Quartz site + 30 prebuild scripts
# + 15 functions, on a 30-core build machine) on EVERY push. That Build CPU
# Minutes firehose ran the Vercel bill to ~$220/mo and tripped the account
# deploy limit on 2026-06-08, freezing production while still billing for the
# failing builds.
#
# The fix: push-triggered auto-deploys are disabled in vercel.json
# (git.deploymentEnabled = false). FRANK and Codex can keep pushing for backup
# + multi-agent sync, but the public site rebuilds only when this workflow is
# manually run. One manual build batches every push since the last publish, so
# cost scales with human publish decisions, not commit rate or a timer.
#
# COST/FRESHNESS KNOB: manual workflow_dispatch is the default emergency brake.
# Add a cron back only when a specific build budget has been approved.
#
# SETUP (one-time, Vercel + GitHub dashboards):
#   1. Vercel → Project heavymetalindex → Settings → Git → Deploy Hooks:
#      create a hook named "scheduled" on branch `main`, copy its URL.
#   2. GitHub → repo Settings → Secrets and variables → Actions → New repository
#      secret named VERCEL_DEPLOY_HOOK_URL = that URL.
# Until the secret exists this workflow fails loudly (by design) and nothing
# deploys. Use the "Run workflow" button (workflow_dispatch) to publish on demand
# at any time, e.g. right after setup to unfreeze prod.

on:
  workflow_dispatch: {} # manual "Run workflow" button for on-demand publishes
  # Temporary remote-session publish path (2026-07-04): the Claude cloud session
  # cannot call workflow_dispatch (integration lacks Actions write) or reach the
  # Vercel API through its egress proxy. A push to this branch whose commit
  # message contains [deploy] fires the same hook. Remove once merged/unneeded.
  push:
    branches: [claude/heavymetalindex-build-connection-3o9d90]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Fire Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set. Create a Deploy Hook (Vercel → Project → Settings → Git → Deploy Hooks, branch main) and add its URL as a repo Actions secret named VERCEL_DEPLOY_HOOK_URL."
            exit 1
          fi
          echo "Triggering production deploy of origin/main via Vercel Deploy Hook…"
          code=$(curl -fsS -X POST "$HOOK_URL" -o response.json -w "%{http_code}")
          echo "HTTP $code"
          cat response.json 2>/dev/null || true
