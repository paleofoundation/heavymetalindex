<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Heavy Metal Fetch — element-tile mark in the brand red (#cc3333). -->
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="#cc3333"/>
    <rect width="1024" height="1024" fill="none" stroke="#a02727" stroke-width="24"/>
    <!-- atomic number -->
    <text x="150" y="270" fill="#ffffff" font-family="Lora, Georgia, serif" font-size="120" opacity="0.92">82</text>
    <!-- symbol -->
    <text x="512" y="640" fill="#ffffff" font-family="Lora, Georgia, serif" font-size="440" text-anchor="middle">Pb</text>
    <!-- name -->
    <text x="512" y="830" fill="#ffffff" font-family="Inter, sans-serif" font-size="112" text-anchor="middle" letter-spacing="6" opacity="0.92">LEAD</text>
  </g>
</svg>
